<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberStream — Tesla YouTube Player</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070710;--fg:#f2f2f7;--muted:#6b6b80;--accent:#ff2d4d;--accent2:#ff6b3d;--glow:rgba(255,45,77,.4);--border:rgba(255,255,255,.08);--ok:#22e08a;--warn:#ffcb3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:none}
body{background:var(--bg);color:var(--fg);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:48px 48px}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;width:100vw}
.glass{background:rgba(15,15,26,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--glow)}
.logo h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;letter-spacing:.05em}
.logo .ac{color:var(--accent)}
.logo p{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.1em}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;margin-left:8px;border:1px solid var(--border)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pill span{font-size:10px;color:var(--muted);font-family:monospace}
.url-wrap{flex:1;max-width:600px;position:relative}
.url-wrap input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:99px;padding:11px 90px 11px 38px;color:var(--fg);font-size:14px;outline:none}
.url-wrap input:focus{border-color:var(--accent)}
.url-wrap .link-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.btn-load{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:99px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn-load:hover{box-shadow:0 0 18px var(--glow)}
.btn-load:active{transform:translateY(-50%) scale(.96)}
.ib{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.ib:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.ib:active{transform:scale(.94)}
.ib svg{width:18px;height:18px}
.main{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}
.sidebar{width:280px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:rgba(10,10,18,.6)}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 4px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;position:relative;font-family:'Orbitron',sans-serif;transition:color .2s}
.tab.active{color:var(--accent)}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.sb-content{flex:1;overflow-y:auto;padding:16px;display:none}
.sb-content.active{display:block}
/* Video Container for Overlay */
.video-container {
    flex:1;
    position:relative;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
}
iframe {
    width:100%;
    height:100%;
    border:none;
}
/* Overlay for Play Interaction */
.play-overlay {
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    cursor: pointer;
    transition: opacity 0.3s;
}
.play-btn {
    width: 60px;
    height: 60px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px var(--glow);
    transition: transform 0.2s;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn svg { width: 24px; height: 24px; fill: white; margin-left: 4px; }
.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="app">
    <div class="topbar glass">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
            <div>
                <h1>Cyber<span class="ac">Stream</span></h1>
                <p>YOUTUBE PLAYER</p>
            </div>
        </div>
        <div class="url-wrap">
            <svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <input type="text" id="urlInput" placeholder="Paste YouTube URL here..." value="https://www.youtube.com/watch?v=jNQXAC9IVRw">
            <button class="btn-load" id="loadBtn">Load</button>
        </div>
    </div>

    <div class="main">
        <div class="sidebar glass">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('queue')">Queue</button>
                <button class="tab" onclick="switchTab('settings')">Settings</button>
            </div>
            <div id="queue" class="sb-content active">
                <div style="color:var(--muted);text-align:center;margin-top:20px;font-size:12px;">Loading...</div>
            </div>
            <div id="settings" class="sb-content">
                <div style="padding:10px 0;">
                    <label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;">
                        <input type="checkbox" id="loopCheck" checked> Loop Video
                    </label>
                </div>
            </div>
        </div>

        <div class="video-container">
            <div class="play-overlay" id="playOverlay">
                <div class="play-btn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <iframe id="ytPlayer" 
                src="" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('urlInput');
    const loadBtn = document.getElementById('loadBtn');
    const iframe = document.getElementById('ytPlayer');
    const overlay = document.getElementById('playOverlay');
    const loopCheck = document.getElementById('loopCheck');

    function extractVideoId(url) {
        const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[7].length == 11) ? match[7] : null;
    }

    function loadVideo() {
        const url = input.value;
        const videoId = extractVideoId(url);
        if (videoId) {
            // Clear iframe to reset state
            iframe.src = "";
            // Force reflow
            void iframe.offsetWidth;
            
            // Construct URL with parameters for better mobile/tesla compatibility
            const newSrc = `https://www.youtube.com/embed/${videoId}?autoplay=0&mute=1&controls=1&playsinline=1&enablejsapi=1`;
            iframe.src = newSrc;
            
            // Show overlay again waiting for user click
            overlay.classList.remove('hidden');
        } else {
            alert("Invalid YouTube URL");
        }
    }

    loadBtn.addEventListener('click', loadVideo);
    
    // Handle overlay click to allow autoplay
    overlay.addEventListener('click', () => {
        overlay.classList.add('hidden');
        // Optional: Try to unmute if user clicks (some browsers require interaction)
        // Note: Tesla's specific mute logic can be tricky. Usually keeping it muted 
        // and relying on the "click to play" interaction is the most robust way 
        // to bypass the "Driving Mode" block.
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sb-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabName).classList.add('active');
    }
</script>
</body>
</html>
